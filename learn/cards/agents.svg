<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" width="900" height="822" role="img">
<title>Study card: Agents</title>
<desc>An agent is a loop: the model chooses an action, the program carries it out, the result comes back, and a stop rule ends the loop.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fdeef3"/>
<stop offset="1" stop-color="#f6d5e0"/>
</linearGradient>
</defs>
<rect width="900" height="822" rx="40" fill="url(#bg)"/>
<rect x="36" y="36" width="828" height="750" rx="32" fill="#fffdf8"/>
<rect x="36" y="36" width="14" height="750" fill="#6d2340"/>
<text x="72" y="92" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#6d2340">STUDY CARD 05 · THE LOOP</text>
<text x="72" y="150" font-family="Palatino, Georgia, serif" font-size="48" fill="#1b2430">Agents</text>
<text x="72" y="220" font-family="Palatino, Georgia, serif" font-size="24" fill="#3a4858">Plan, act, observe, reflect, and stop on</text>
<text x="72" y="254" font-family="Palatino, Georgia, serif" font-size="24" fill="#3a4858">purpose.</text>
<circle cx="96" cy="350" r="18" fill="#6d2340"/><text x="96" y="356" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">1</text>
<text x="132" y="346" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">ReAct interleaves a reasoning note with an</text>
<text x="132" y="376" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">action (Yao et al., 2023).</text>
<circle cx="96" cy="436" r="18" fill="#6d2340"/><text x="96" y="442" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">2</text>
<text x="132" y="432" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">The model proposes a tool call. The host</text>
<text x="132" y="462" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">executes it.</text>
<circle cx="96" cy="522" r="18" fill="#6d2340"/><text x="96" y="528" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">3</text>
<text x="132" y="518" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">Observation includes failures and empty results.</text>
<circle cx="96" cy="578" r="18" fill="#6d2340"/><text x="96" y="584" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">4</text>
<text x="132" y="574" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">Reflection asks whether the goal is actually</text>
<text x="132" y="604" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">met.</text>
<circle cx="96" cy="664" r="18" fill="#6d2340"/><text x="96" y="670" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">5</text>
<text x="132" y="660" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">Stop on success, budget, repeated error, or</text>
<text x="132" y="690" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">required approval.</text>
<line x1="72" y1="306" x2="828" y2="306" stroke="#6d2340" stroke-width="2" opacity="0.45"/>
<text x="72" y="770" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#3a4858">AI Lab Free University · Fundamentals · vendor-neutral notes</text>
</svg>
