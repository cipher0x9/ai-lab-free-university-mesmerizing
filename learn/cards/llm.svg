<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 852" width="900" height="852" role="img">
<title>Study card: Large language models</title>
<desc>A large language model is a neural network, usually a transformer, trained to estimate which token comes next.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f6f0fc"/>
<stop offset="1" stop-color="#e6d9f6"/>
</linearGradient>
</defs>
<rect width="900" height="852" rx="40" fill="url(#bg)"/>
<rect x="36" y="36" width="828" height="780" rx="32" fill="#fffdf8"/>
<rect x="36" y="36" width="14" height="780" fill="#3d2a6d"/>
<text x="72" y="92" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#3d2a6d">STUDY CARD 01 · THE MODEL</text>
<text x="72" y="150" font-family="Palatino, Georgia, serif" font-size="48" fill="#1b2430">Large language models</text>
<text x="72" y="220" font-family="Palatino, Georgia, serif" font-size="24" fill="#3a4858">It scores the next token. It does not</text>
<text x="72" y="254" font-family="Palatino, Georgia, serif" font-size="24" fill="#3a4858">look up a fact.</text>
<circle cx="96" cy="350" r="18" fill="#3d2a6d"/><text x="96" y="356" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">1</text>
<text x="132" y="346" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">Self-attention mixes tokens inside one context</text>
<text x="132" y="376" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">window (Vaswani et al., 2017).</text>
<circle cx="96" cy="436" r="18" fill="#3d2a6d"/><text x="96" y="442" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">2</text>
<text x="132" y="432" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">Many chat models are decoder-only: one next</text>
<text x="132" y="462" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">token, then another.</text>
<circle cx="96" cy="522" r="18" fill="#3d2a6d"/><text x="96" y="528" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">3</text>
<text x="132" y="518" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">Instruction tuning and preference tuning update</text>
<text x="132" y="548" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">weights. A prompt does not.</text>
<circle cx="96" cy="608" r="18" fill="#3d2a6d"/><text x="96" y="614" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">4</text>
<text x="132" y="604" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">The context window is a token budget for a</text>
<text x="132" y="634" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">single request.</text>
<circle cx="96" cy="694" r="18" fill="#3d2a6d"/><text x="96" y="700" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">5</text>
<text x="132" y="690" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">Fluent output can still be false. Check it</text>
<text x="132" y="720" font-family="Palatino, Georgia, serif" font-size="22" fill="#1b2430">against a source.</text>
<line x1="72" y1="306" x2="828" y2="306" stroke="#3d2a6d" stroke-width="2" opacity="0.45"/>
<text x="72" y="800" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#3a4858">AI Lab Free University · Fundamentals · vendor-neutral notes</text>
</svg>
