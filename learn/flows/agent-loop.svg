<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" width="720" height="1180" role="img">
<title>Agent loop</title>
<desc>Plan, act with tools, observe, reflect, and stop. If the goal is not met, continue from the plan.</desc>
<defs>
<linearGradient id="agent-bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fdeef3"/>
<stop offset="1" stop-color="#f6f1e8"/>
</linearGradient>
<marker id="agent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 1 L 8 5 L 0 9 z" fill="#6d2340"/>
</marker>
</defs>
<rect width="720" height="1180" rx="32" fill="url(#agent-bg)"/>
<text x="40" y="52" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.5" fill="#6d2340">FLOW</text>
<text x="40" y="98" font-family="Palatino, Georgia, serif" font-size="36" fill="#1b2430">Agent loop</text>
<text x="40" y="136" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">The model proposes. The host runs the tool. The loop has a stop.</text>
<rect x="168" y="180" width="500" height="112" rx="22" fill="#fffdf8" stroke="#6d2340" stroke-opacity="0.35"/><circle cx="214" cy="236" r="22" fill="#6d2340"/><text x="214" y="242" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">1</text><text x="252" y="228" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Plan</text><text x="252" y="260" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Name the goal and what done means.</text><rect x="168" y="330" width="500" height="112" rx="22" fill="#fffdf8" stroke="#6d2340" stroke-opacity="0.35"/><circle cx="214" cy="386" r="22" fill="#6d2340"/><text x="214" y="392" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">2</text><text x="252" y="378" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Act with tools</text><text x="252" y="410" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">The host checks the call, then runs it.</text><rect x="168" y="480" width="500" height="112" rx="22" fill="#fffdf8" stroke="#6d2340" stroke-opacity="0.35"/><circle cx="214" cy="536" r="22" fill="#6d2340"/><text x="214" y="542" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">3</text><text x="252" y="528" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Observe</text><text x="252" y="560" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Write down the result, including errors.</text><rect x="168" y="630" width="500" height="112" rx="22" fill="#fffdf8" stroke="#6d2340" stroke-opacity="0.35"/><circle cx="214" cy="686" r="22" fill="#6d2340"/><text x="214" y="692" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">4</text><text x="252" y="678" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Reflect</text><text x="252" y="710" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Does this meet the goal?</text><line x1="418" y1="292" x2="418" y2="330" stroke="#6d2340" stroke-width="3" marker-end="url(#agent-arrow)"/><line x1="418" y1="442" x2="418" y2="480" stroke="#6d2340" stroke-width="3" marker-end="url(#agent-arrow)"/><line x1="418" y1="592" x2="418" y2="630" stroke="#6d2340" stroke-width="3" marker-end="url(#agent-arrow)"/><line x1="418" y1="742" x2="418" y2="788" stroke="#6d2340" stroke-width="3" marker-end="url(#agent-arrow)"/><rect x="168" y="788" width="500" height="118" rx="22" fill="#fff6ea" stroke="#6d2340"/><text x="192" y="828" font-family="Palatino, Georgia, serif" font-size="24" fill="#1b2430">Stop condition</text><text x="192" y="860" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Goal met, budget spent, error repeated,</text><text x="192" y="886" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">or a person must approve.</text><line x1="418" y1="906" x2="418" y2="948" stroke="#6d2340" stroke-width="3" marker-end="url(#agent-arrow)"/><rect x="168" y="948" width="500" height="78" rx="22" fill="#14532d"/><text x="418" y="994" text-anchor="middle" font-family="Palatino, Georgia, serif" font-size="24" fill="#ffffff">Stop</text><path d="M168 686 H92 V236 H168" fill="none" stroke="#6d2340" stroke-width="3" marker-end="url(#agent-arrow)"/><text x="28" y="470" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" fill="#6d2340" transform="rotate(-90 48 470)">Not done · continue</text>
<text x="40" y="1128" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" fill="#3a4858">AI Lab Free University · Fundamentals</text>
</svg>
