<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1438" width="640" height="1438" role="img">
<title>RAG pipeline</title>
<desc>Ingest, chunk, embed, index, retrieve, rerank, generate, and cite.</desc>
<defs>
<linearGradient id="rag-bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eaf2fc"/>
<stop offset="1" stop-color="#f6f1e8"/>
</linearGradient>
<marker id="rag-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 1 L 8 5 L 0 9 z" fill="#163a6b"/>
</marker>
</defs>
<rect width="640" height="1438" rx="32" fill="url(#rag-bg)"/>
<text x="36" y="58" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.5" fill="#163a6b">FLOW</text>
<text x="36" y="100" font-family="Palatino, Georgia, serif" font-size="36" fill="#1b2430">RAG pipeline</text>
<text x="36" y="136" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Same embedding model when you index and when you ask.</text>
<rect x="36" y="168" width="568" height="132" rx="22" fill="#fffdf8" stroke="#163a6b" stroke-opacity="0.35"/><circle cx="78" cy="208" r="20" fill="#163a6b"/><text x="78" y="214" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">1</text><text x="112" y="214" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Ingest</text><text x="56" y="252" font-family="Palatino, Georgia, serif" font-size="18" fill="#1b2430">Accept the document, its source, its date, and who may read it.</text><text x="56" y="278" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Keep the original passage. A vector does not replace it.</text><line x1="320" y1="300" x2="320" y2="318" stroke="#163a6b" stroke-width="3" marker-end="url(#rag-arrow)"/><rect x="36" y="318" width="568" height="132" rx="22" fill="#fffdf8" stroke="#163a6b" stroke-opacity="0.35"/><circle cx="78" cy="358" r="20" fill="#163a6b"/><text x="78" y="364" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">2</text><text x="112" y="364" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Chunk</text><text x="56" y="402" font-family="Palatino, Georgia, serif" font-size="18" fill="#1b2430">Split the document into passages you can return on their own.</text><text x="56" y="428" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Overlap the edges so a cut sentence survives in one chunk.</text><line x1="320" y1="450" x2="320" y2="468" stroke="#163a6b" stroke-width="3" marker-end="url(#rag-arrow)"/><rect x="36" y="468" width="568" height="132" rx="22" fill="#fffdf8" stroke="#163a6b" stroke-opacity="0.35"/><circle cx="78" cy="508" r="20" fill="#163a6b"/><text x="78" y="514" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">3</text><text x="112" y="514" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Embed</text><text x="56" y="552" font-family="Palatino, Georgia, serif" font-size="18" fill="#1b2430">Map each chunk with a single embedding model.</text><text x="56" y="578" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Record that model’s name. Another model is another space.</text><line x1="320" y1="600" x2="320" y2="618" stroke="#163a6b" stroke-width="3" marker-end="url(#rag-arrow)"/><rect x="36" y="618" width="568" height="132" rx="22" fill="#fffdf8" stroke="#163a6b" stroke-opacity="0.35"/><circle cx="78" cy="658" r="20" fill="#163a6b"/><text x="78" y="664" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">4</text><text x="112" y="664" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Index</text><text x="56" y="702" font-family="Palatino, Georgia, serif" font-size="18" fill="#1b2430">Store the vector, the passage, and the filter fields.</text><text x="56" y="728" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">An exact scan is honest. Approximate search is a measured trade.</text><line x1="320" y1="750" x2="320" y2="768" stroke="#163a6b" stroke-width="3" marker-end="url(#rag-arrow)"/><rect x="36" y="768" width="568" height="132" rx="22" fill="#fffdf8" stroke="#163a6b" stroke-opacity="0.35"/><circle cx="78" cy="808" r="20" fill="#163a6b"/><text x="78" y="814" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">5</text><text x="112" y="814" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Retrieve</text><text x="56" y="852" font-family="Palatino, Georgia, serif" font-size="18" fill="#1b2430">Embed the query the same way and take the top k.</text><text x="56" y="878" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">A lexical ranker such as BM25 can run beside the vectors.</text><line x1="320" y1="900" x2="320" y2="918" stroke="#163a6b" stroke-width="3" marker-end="url(#rag-arrow)"/><rect x="36" y="918" width="568" height="132" rx="22" fill="#fffdf8" stroke="#163a6b" stroke-opacity="0.35"/><circle cx="78" cy="958" r="20" fill="#163a6b"/><text x="78" y="964" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">6</text><text x="112" y="964" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Rerank</text><text x="56" y="1002" font-family="Palatino, Georgia, serif" font-size="18" fill="#1b2430">Rescore the short list, often with a cross-encoder.</text><text x="56" y="1028" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">Spend that cost on dozens of hits, not on the whole corpus.</text><line x1="320" y1="1050" x2="320" y2="1068" stroke="#163a6b" stroke-width="3" marker-end="url(#rag-arrow)"/><rect x="36" y="1068" width="568" height="132" rx="22" fill="#fffdf8" stroke="#163a6b" stroke-opacity="0.35"/><circle cx="78" cy="1108" r="20" fill="#163a6b"/><text x="78" y="1114" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">7</text><text x="112" y="1114" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Generate</text><text x="56" y="1152" font-family="Palatino, Georgia, serif" font-size="18" fill="#1b2430">Answer from the question and the passages you kept.</text><text x="56" y="1178" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">If those passages are silent, say that they are silent.</text><line x1="320" y1="1200" x2="320" y2="1218" stroke="#163a6b" stroke-width="3" marker-end="url(#rag-arrow)"/><rect x="36" y="1218" width="568" height="132" rx="22" fill="#fffdf8" stroke="#163a6b" stroke-opacity="0.35"/><circle cx="78" cy="1258" r="20" fill="#163a6b"/><text x="78" y="1264" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">8</text><text x="112" y="1264" font-family="Palatino, Georgia, serif" font-size="26" fill="#1b2430">Cite</text><text x="56" y="1302" font-family="Palatino, Georgia, serif" font-size="18" fill="#1b2430">Point each material claim at a retrieved passage.</text><text x="56" y="1328" font-family="Palatino, Georgia, serif" font-size="18" fill="#3a4858">A pointer still has to be checked against the words it names.</text>
<text x="36" y="1402" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" fill="#3a4858">AI Lab Free University · Fundamentals</text>
</svg>
